name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Agent skill is discoverable
        shell: bash
        run: |
          npx -y skills@1 add . --list 2>&1 | sed 's/\x1b\[[0-9;]*m//g' > skills.txt
          cat skills.txt
          grep -q "Found 1 skill" skills.txt

  test:
    name: test (macOS, APFS)
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Environment
        run: |
          sw_vers
          git --version
          df -h "$TMPDIR"
      - name: Test suite (with failpoints)
        run: cargo test --features failpoints --no-fail-fast

  test-linux:
    name: test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs xfsprogs python3-venv
      - name: Clippy (Linux)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Mount btrfs, XFS (reflink) and ext4 loop filesystems
        # The same script scripts/linux-test.sh runs in its container: it prints
        # PARHEL_TEST_BTRFS/XFS/EXT4, PARHEL_REQUIRE_FS and TMPDIR (on btrfs) for
        # the steps below.
        # bash with pipefail: a failing mount script must fail the step, not tee.
        shell: bash
        run: |
          sudo modprobe loop btrfs xfs || true
          sudo scripts/mount-test-filesystems.sh "$USER" | tee -a "$GITHUB_ENV"
      - name: Environment
        run: |
          uname -r
          git --version
          df -h "$TMPDIR"
      - name: Test suite (with failpoints)
        run: cargo test --features failpoints --no-fail-fast

  setup-linux:
    name: setup (Linux)
    runs-on: ubuntu-24.04
    # `git parhel setup` creates a loop-mounted btrfs image, a systemd unit and
    # /parhel/<user> and needs root, so its tests (tests/setup.rs) change the machine and
    # run only here: PARHEL_TEST_SETUP=1. They run as the ordinary runner user, like the
    # product: the few commands that need root (the binary's `setup`, systemctl, rm/mv of
    # the protected image) go through `sudo -n` inside the tests. Running the whole test
    # binary under sudo instead would make root create the worktrees and hide permission
    # bugs, and cargo would not find the toolchain. Needs systemd as PID 1 (the hosted
    # runners have it) and passwordless sudo.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install btrfs-progs and e2fsprogs (chattr)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs e2fsprogs xfsprogs python3-venv
      - name: What setup needs from the machine
        shell: bash
        run: |
          id
          echo "PID 1: $(ps -p 1 -o comm=)"
          # Each prerequisite on its own line, so a missing one is named in the log.
          missing=0
          check() {
            if out=$("$@" 2>&1); then echo "ok: $*"; else echo "MISSING: $* -> $out"; missing=1; fi
          }
          check sudo -n true
          check systemctl --version
          check sudo modprobe loop
          check sudo modprobe btrfs
          check grep -w btrfs /proc/filesystems
          check command -v mkfs.btrfs
          check command -v chattr
          check command -v systemd-escape
          exit "$missing"
      - name: Mount the ext4 filesystem for the sources (shared script)
        # The same script as the test job: also prints PARHEL_TEST_EXT4 and friends.
        shell: bash
        run: |
          sudo modprobe loop btrfs xfs || true
          sudo scripts/mount-test-filesystems.sh "$USER" | tee -a "$GITHUB_ENV"
      - name: Build the tests (as the ordinary user)
        run: cargo test --features failpoints --test setup --no-run
      - name: Setup tests (sudo, systemd, loop mounts)
        env:
          PARHEL_TEST_SETUP: "1"
        # One at a time: they share /parhel/<user>.
        run: cargo test --features failpoints --test setup --no-fail-fast -- --test-threads=1
      - name: Leftovers (should be none)
        if: always()
        shell: bash
        run: |
          sudo systemctl list-units --all 'parhel-*' --no-legend || true
          ls -la /var/lib/parhel /parhel 2>&1 || true

  linux-musl:
    name: build linux musl (${{ matrix.target }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, as in the release workflow: the binary is run.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Clippy (musl)
        # The libc types differ from glibc's (`ioctl` takes an int, `f_type` an unsigned
        # long), so lints that are silent on the gnu targets can fire here.
        run: cargo clippy --all-targets --all-features --target "${{ matrix.target }}" -- -D warnings
      - name: Build the release binary (as the release workflow does)
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" --bin git-parhel
          cp "target/${{ matrix.target }}/release/git-parhel" git-parhel
          file git-parhel
          # (Not piped: with pipefail, grep -q closing the pipe would fail readelf.)
          readelf -l git-parhel > program-headers.txt
          if grep -q INTERP program-headers.txt; then echo "git-parhel is dynamically linked"; exit 1; fi
      - name: Smoke test
        run: scripts/smoke-test.sh ./git-parhel
      - name: Build the .deb and .rpm (as the release workflow does)
        run: |
          scripts/build-packages.sh "${{ matrix.target }}" dist
          ls -l dist
          (cd dist && sha256sum -c ./*.sha256)
      - name: Lint the .deb
        # Errors fail the job. The two tags the package overrides, and why, are in
        # packaging/debian/lintian-overrides; everything else is printed.
        run: |
          sudo apt-get install -y --no-install-recommends lintian
          lintian --version
          lintian --fail-on error --tag-display-limit 0 dist/*.deb
      - name: Install the .deb in Ubuntu 24.04
        run: scripts/test-package.sh ubuntu:24.04 dist/*.deb
      - name: Install the .deb in Debian stable
        run: scripts/test-package.sh debian:stable dist/*.deb
      - name: Install the .rpm in Fedora
        run: scripts/test-package.sh fedora:latest dist/*.rpm

  msrv:
    name: MSRV (shipped binary)
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin git-parhel

  intel:
    name: build x86_64
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-apple-darwin --bin git-parhel

  formula:
    name: Homebrew formula audit
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Audit the formula template (style only; checksums are placeholders)
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          # Distinct placeholders: the audit rejects identical checksums in branches.
          sha() { printf "%0*d" 64 "$1"; }
          brew tap-new --no-git local/verify >/dev/null
          packaging/render-formula.sh "$version" "$(sha 1)" "$(sha 2)" "$(sha 3)" \
            > "$(brew --repository local/verify)/Formula/parhel.rb"
          brew audit --strict local/verify/parhel

  git-versions:
    name: git ${{ matrix.git }}
    needs: lint
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # 2.29: the oldest supported version. 2.39: the generation Apple ships.
        git: ["2.29.3", "2.39.5"]
    env:
      GIT_PREFIX_DIR: ${{ github.workspace }}/../git-${{ matrix.git }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache git ${{ matrix.git }}
        id: git-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GIT_PREFIX_DIR }}
          key: git-${{ matrix.git }}-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build git ${{ matrix.git }} from the official tarball
        if: steps.git-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${{ matrix.git }}.tar.xz" | tar xJ
          make -C "git-${{ matrix.git }}" -j"$(sysctl -n hw.ncpu)" prefix="$GIT_PREFIX_DIR" \
            NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 NO_INSTALL_HARDLINKS=1 install
      - name: Put it first on PATH
        run: |
          echo "$GIT_PREFIX_DIR/bin" >> "$GITHUB_PATH"
          "$GIT_PREFIX_DIR/bin/git" --version | grep -q "git version ${{ matrix.git }}"
      - name: Test suite against git ${{ matrix.git }}
        # Skipped on purpose: these test git features newer than this version
        # (reftable: git 2.45; worktree.useRelativePaths: git 2.48).
        run: |
          git --version
          cargo test --features failpoints --no-fail-fast -- \
            --skip i105_reftable_repository --skip i105b_reftable_rollback_removes_branch \
            --skip i180_relative_worktree_links

