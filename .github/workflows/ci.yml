name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (macOS, APFS)
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Environment
        run: |
          sw_vers
          git --version
          df -h "$TMPDIR"
      - name: Test suite (with failpoints)
        run: cargo test --features failpoints --no-fail-fast

  msrv:
    name: MSRV (shipped binary)
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin git-parhel

  intel:
    name: build x86_64
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-apple-darwin --bin git-parhel

  formula:
    name: Homebrew formula audit
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Audit the formula template (style only; checksum is a placeholder)
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          brew tap-new --no-git local/verify >/dev/null
          sed -e "s/@VERSION@/${version}/g" -e "s/@SHA256@/$(printf '0%.0s' $(seq 64))/g" \
            packaging/parhel.rb.in > "$(brew --repository local/verify)/Formula/parhel.rb"
          brew audit --strict local/verify/parhel
