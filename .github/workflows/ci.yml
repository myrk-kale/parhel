name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Agent skill is discoverable
        run: npx -y skills@1 add . --list 2>&1 | tee /dev/stderr | grep -q "Found 1 skill"

  test:
    name: test (macOS, APFS)
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Environment
        run: |
          sw_vers
          git --version
          df -h "$TMPDIR"
      - name: Test suite (with failpoints)
        run: cargo test --features failpoints --no-fail-fast

  msrv:
    name: MSRV (shipped binary)
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin git-parhel

  intel:
    name: build x86_64
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-apple-darwin --bin git-parhel

  formula:
    name: Homebrew formula audit
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Audit the formula template (style only; checksum is a placeholder)
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          brew tap-new --no-git local/verify >/dev/null
          sed -e "s/@VERSION@/${version}/g" -e "s/@SHA256@/$(printf '0%.0s' $(seq 64))/g" \
            packaging/parhel.rb.in > "$(brew --repository local/verify)/Formula/parhel.rb"
          brew audit --strict local/verify/parhel

  git-versions:
    name: git ${{ matrix.git }}
    needs: lint
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # 2.29: the oldest supported version. 2.39: the generation Apple ships.
        git: ["2.29.3", "2.39.5"]
    env:
      GIT_PREFIX_DIR: ${{ github.workspace }}/../git-${{ matrix.git }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache git ${{ matrix.git }}
        id: git-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GIT_PREFIX_DIR }}
          key: git-${{ matrix.git }}-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build git ${{ matrix.git }} from the official tarball
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${{ matrix.git }}.tar.xz" | tar xJ
          make -C "git-${{ matrix.git }}" -j"$(sysctl -n hw.ncpu)" prefix="$GIT_PREFIX_DIR" \
            NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 NO_INSTALL_HARDLINKS=1 install
      - name: Put it first on PATH
        run: |
          echo "$GIT_PREFIX_DIR/bin" >> "$GITHUB_PATH"
          "$GIT_PREFIX_DIR/bin/git" --version | grep -q "git version ${{ matrix.git }}"
      - name: Test suite against git ${{ matrix.git }}
        # Skipped on purpose: these test git features newer than this version
        # (reftable: git 2.45; worktree.useRelativePaths: git 2.48).
        run: |
          git --version
          cargo test --features failpoints --no-fail-fast -- \
            --skip i105_reftable_repository --skip i105b_reftable_rollback_removes_branch \
            --skip i180_relative_worktree_links

