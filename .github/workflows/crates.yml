name: crates.io

# Publishes the crate for a released tag using crates.io Trusted Publishing:
# GitHub's OIDC token is exchanged for a short-lived crates.io token, so no
# long-lived secret is stored. crates.io trusts this workflow file
# (myrk-kale/parhel, crates.yml); it must run as its own workflow, not as a
# reusable one, so release.yml dispatches it instead of calling it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.1)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${version}" = "${{ inputs.tag }}"
      # Authenticate first, even when the version is already published, so a
      # manual run against an existing tag verifies the Trusted Publishing setup.
      - name: Authenticate with crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish (skips if this version is already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -fsS -A "parhel-release (github.com/myrk-kale/parhel)" \
               "https://crates.io/api/v1/crates/parhel/${version}" >/dev/null 2>&1; then
            echo "parhel ${version} already published"
            exit 0
          fi
          cargo publish --locked
