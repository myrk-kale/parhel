name: crates.io

# Publishes the crate for a released version. Called by the release workflow and
# runnable by hand for an existing tag. The token is only read from the
# CARGO_REGISTRY_TOKEN secret.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.1)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${version}" = "${{ inputs.tag }}"
      - name: Publish (skips if this version is already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -fsS -A "parhel-release (github.com/myrk-kale/parhel)" \
               "https://crates.io/api/v1/crates/parhel/${version}" >/dev/null 2>&1; then
            echo "parhel ${version} already published"
            exit 0
          fi
          cargo publish --locked
