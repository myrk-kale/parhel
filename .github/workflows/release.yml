name: Release

on:
  push:
    tags: ["v*.*.*"]

# Read-only by default; the jobs that publish declare what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-macos:
    name: Build universal binary (macOS)
    needs: ci
    runs-on: macos-15
    permissions:
      contents: read
      # Signed build provenance (SLSA), verifiable with `gh attestation verify`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Check tag matches Cargo.toml
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --bin git-parhel
          cargo build --release --locked --target x86_64-apple-darwin --bin git-parhel
          lipo -create -output git-parhel \
            target/aarch64-apple-darwin/release/git-parhel \
            target/x86_64-apple-darwin/release/git-parhel
          lipo -info git-parhel
      - name: Smoke test
        run: |
          ./git-parhel --version
          tmp="$(mktemp -d)"
          git init -q -b main "$tmp/src"
          git -C "$tmp/src" -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m init
          (cd "$tmp/src" && "$GITHUB_WORKSPACE/git-parhel" add ../wt --new-branch smoke)
          test -z "$(git -C "$tmp/wt" status --porcelain)"
      - name: Package
        id: package
        run: |
          archive="parhel-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz"
          mkdir -p dist/pkg/man
          cp git-parhel README.md LICENSE CHANGELOG.md dist/pkg/
          cp man/*.1 dist/pkg/man/
          tar -C dist/pkg -czf "dist/${archive}" .
          (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "dist/${archive}.sha256")" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/${{ steps.package.outputs.archive }}
            git-parhel
      - name: Keep the archive for the release
        uses: actions/upload-artifact@v4
        with:
          name: dist-universal-apple-darwin
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  build-linux:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners, so the binary can be run for the smoke test. musl
          # makes the binary static: it runs on any distribution, glibc or not.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Check tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Build
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" --bin git-parhel
          cp "target/${{ matrix.target }}/release/git-parhel" git-parhel
          file git-parhel
          # Static: no program interpreter (a dynamic loader), so no shared libraries.
          # (Not piped: with pipefail, grep -q closing the pipe would fail readelf.)
          readelf -l git-parhel > program-headers.txt
          if grep -q INTERP program-headers.txt; then echo "git-parhel is dynamically linked"; exit 1; fi
      - name: Smoke test
        # The runner's disk is ext4: `add` must refuse with not-cow, `--copy` must work.
        run: scripts/smoke-test.sh ./git-parhel
      - name: Package
        id: package
        run: |
          archive="parhel-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          mkdir -p dist/pkg/man
          cp git-parhel README.md LICENSE CHANGELOG.md dist/pkg/
          cp man/*.1 dist/pkg/man/
          tar -C dist/pkg -czf "dist/${archive}" .
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - name: Smoke test the packaged binary
        run: |
          mkdir unpacked
          tar -xzf "dist/${{ steps.package.outputs.archive }}" -C unpacked
          test -f unpacked/man/git-parhel.1
          scripts/smoke-test.sh unpacked/git-parhel
      - name: Build the .deb and .rpm
        # From the binary built above, with the tool versions pinned in the script.
        # CI installs both packages in Ubuntu, Debian and Fedora containers and
        # runs lintian on the .deb before a release can start.
        run: |
          scripts/build-packages.sh "${{ matrix.target }}" dist
          ls -l dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/${{ steps.package.outputs.archive }}
            dist/*.deb
            dist/*.rpm
            git-parhel
      - name: Keep the archive and the packages for the release
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect the archives
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - name: Verify the checksums and the set of files
        working-directory: dist
        shell: bash
        run: |
          ls -l
          version="${GITHUB_REF_NAME#v}"
          expected=()
          for target in universal-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            expected+=("parhel-${GITHUB_REF_NAME}-${target}.tar.gz")
          done
          expected+=(
            "parhel_${version}_amd64.deb" "parhel_${version}_arm64.deb"
            "parhel-${version}-1.x86_64.rpm" "parhel-${version}-1.aarch64.rpm"
          )
          for file in "${expected[@]}"; do
            sha256sum -c "${file}.sha256"
          done
          # Nothing else may be attached: seven files, each with its checksum, and the notes.
          files=(./*.tar.gz ./*.deb ./*.rpm)
          test "${#files[@]}" = 7
          sums=(./*.sha256)
          test "${#sums[@]}" = 7
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            dist/*.deb \
            dist/*.deb.sha256 \
            dist/*.rpm \
            dist/*.rpm.sha256 \
            install.sh \
            --title "o(O)o parhel ${GITHUB_REF_NAME}" \
            --notes-file dist/notes.md

  homebrew:
    needs: release
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  crates:
    name: Dispatch crates.io publish
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run crates.yml for this tag (Trusted Publishing needs its own run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run crates.yml -R "$GITHUB_REPOSITORY" -f tag="${GITHUB_REF_NAME}"
