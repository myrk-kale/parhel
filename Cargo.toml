[package]
name = "parhel"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Create Git worktrees with filesystem copy-on-write, ignored build output (node_modules, target/) included. macOS (APFS) and Linux (Btrfs, XFS); Windows planned"
license = "MIT"
readme = "README.md"
repository = "https://github.com/myrk-kale/parhel"
homepage = "https://github.com/myrk-kale/parhel"
authors = ["Kale"]
exclude = [".github/", "skills/", ".serena/", "proptest-regressions/", "packaging/", "install.sh", "assets/*.png"]
keywords = ["git", "worktree", "apfs", "copy-on-write", "reflink"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-parhel"
path = "src/main.rs"

[lib]
name = "parhel"
path = "src/lib.rs"

[features]
default = []
# Compiles in the `failpoint!` hooks driven by the PARHEL_FAILPOINTS env var.
# Test-only: never enable in release builds.
failpoints = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
tempfile = "3.27.0"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
clap_mangen = "0.3.3"
predicates = "3.1.4"
proptest = "1.11.0"
rstest = "0.28.0"
serial_test = "4.0.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Linux packages, built from the already-compiled static musl binary by
# scripts/build-packages.sh (used by the release and CI workflows). The tools'
# versions are pinned there.
[package.metadata.deb]
maintainer = "Kale <parhel-release@users.noreply.github.com>"
section = "vcs"
priority = "optional"
depends = "git (>= 1:2.29)"
# Used by a future `setup` command to prepare a Btrfs volume.
recommends = "btrfs-progs"
license-file = ["packaging/debian/copyright", "0"]
extended-description = """\
Creates Git worktrees with filesystem copy-on-write cloning, so ignored build \
output such as node_modules/ and target/ is in place immediately and takes no \
extra disk space until a file changes. Runs on Btrfs and XFS (reflink); \
--copy and --fallback cover other filesystems."""
# Written by scripts/build-packages.sh for each release.
changelog = "target/debian/changelog"
assets = [
    ["target/release/git-parhel", "usr/bin/git-parhel", "755"],
    ["man/*.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/parhel/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/parhel/changelog", "644"],
    ["packaging/debian/lintian-overrides", "usr/share/lintian/overrides/parhel", "644"],
]

[package.metadata.generate-rpm]
summary = "Git worktrees with copy-on-write cloning, ignored build output included"
license = "MIT"
url = "https://github.com/myrk-kale/parhel"
assets = [
    { source = "target/release/git-parhel", dest = "/usr/bin/git-parhel", mode = "755" },
    { source = "man/*.1", dest = "/usr/share/man/man1/", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/parhel/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/parhel/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/parhel/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
git = ">= 2.29"

[package.metadata.generate-rpm.recommends]
btrfs-progs = "*"
